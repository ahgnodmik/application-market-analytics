# Netlify 배포 설정

[build]
  # 빌드 명령어: 템플릿과 정적 파일을 Functions 디렉토리로 복사
  # Functions 패키징 시 netlify/functions/ 디렉토리만 포함되므로,
  # 프로젝트 루트의 templates/와 static/를 복사해야 함
  command = "mkdir -p netlify/functions/templates netlify/functions/static && cp -r templates/* netlify/functions/templates/ 2>/dev/null || true && cp -r static/* netlify/functions/static/ 2>/dev/null || true"
  # 서버리스 함수 디렉토리
  functions = "netlify/functions"
  # 정적 파일 디렉토리 (저장소 루트 기준)
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.10"

# 모든 요청을 서버리스 함수로 라우팅 (FastAPI가 모든 라우팅 처리)
# server 함수는 netlify/functions/server.py 파일임
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# 환경 변수
[context.production.environment]
  PYTHON_VERSION = "3.10"

[context.deploy-preview.environment]
  PYTHON_VERSION = "3.10"
