{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- 헤더 -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-semibold text-notion-text mb-2">앱 목록</h1>
            <p class="text-notion-text-light text-base">Play Store에서 가져온 앱 데이터를 확인하고 관리하세요</p>
        </div>
        <a href="/category-analysis" class="notion-button notion-button-blue no-underline">
            새 앱 가져오기
        </a>
    </div>

    <!-- 안내 -->
    <div class="notion-card p-4 bg-blue-50 border-blue-200">
        <p class="text-sm text-blue-800">
            💡 <strong>앱 추가 방법:</strong> <a href="/category-analysis" class="underline font-medium">카테고리 분석</a> 페이지에서 카테고리를 선택하고 순위를 가져오면 자동으로 추가됩니다.
        </p>
    </div>

    <!-- 앱 목록 -->
    <div class="notion-card p-5">
        <div id="apps-list" class="space-y-3">
            <p class="text-notion-text-light">로딩 중...</p>
        </div>
    </div>
</div>

<!-- 앱 상세 모달 -->
<div id="app-detail-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" onclick="event.target === this && closeModal('app-detail-modal')">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-notion-border flex justify-between items-center">
            <h3 class="text-xl font-semibold text-notion-text">앱 상세</h3>
            <button onclick="closeModal('app-detail-modal')" class="text-2xl text-notion-text-light hover:text-notion-text">&times;</button>
        </div>
        <div id="app-detail-content" class="p-6"></div>
    </div>
</div>

<script src="/static/apps.js"></script>
<script>
function closeModal(modalId) {
    document.getElementById(modalId).classList.add('hidden');
    document.getElementById(modalId).classList.remove('flex');
}

window.closeModal = closeModal;
</script>
{% endblock %}
