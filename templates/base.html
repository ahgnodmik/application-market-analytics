<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Application Market Analytics{% endblock %}</title>
    <link href="/static/style.css" rel="stylesheet">
    <style>
        /* Notion 스타일 커스텀 */
        :root {
            --notion-bg: #ffffff;
            --notion-sidebar: #f7f6f3;
            --notion-border: #e9e9e7;
            --notion-text: #37352f;
            --notion-text-light: #787774;
            --notion-blue: #2383e2;
            --notion-hover: #f1f1ef;
        }
        body {
            background-color: var(--notion-bg);
            color: var(--notion-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
        }
        .notion-sidebar {
            background-color: var(--notion-sidebar);
            border-right: 1px solid var(--notion-border);
        }
        .notion-card {
            background: var(--notion-bg);
            border: 1px solid var(--notion-border);
            border-radius: 3px;
            transition: all 0.1s ease;
        }
        .notion-card:hover {
            box-shadow: rgba(15, 15, 15, 0.1) 0px 0px 0px 1px, rgba(15, 15, 15, 0.1) 0px 2px 4px;
        }
        .notion-button {
            background: var(--notion-text);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        .notion-button:hover {
            background: #2e2e2e;
        }
        .notion-button-blue {
            background: var(--notion-blue);
        }
        .notion-button-blue:hover {
            background: #1a6bc4;
        }
        .notion-button-green {
            background: #0f7b0f;
        }
        .notion-button-green:hover {
            background: #0d6b0d;
        }
        .notion-link {
            color: var(--notion-text);
            text-decoration: none;
            border-radius: 3px;
            padding: 2px 4px;
            margin: -2px -4px;
            transition: background 0.1s ease;
        }
        .notion-link:hover {
            background: var(--notion-hover);
        }
        .notion-nav-item {
            color: var(--notion-text);
            padding: 4px 8px;
            border-radius: 3px;
            margin: 2px 0;
            display: block;
            text-decoration: none;
            transition: background 0.1s ease;
        }
        .notion-nav-item:hover {
            background: var(--notion-hover);
        }
        .notion-nav-item.active {
            background: var(--notion-hover);
            font-weight: 500;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- 사이드바 -->
    <aside class="notion-sidebar w-64 flex-shrink-0 flex flex-col">
        <div class="p-4 border-b border-notion-border">
            <a href="/" class="text-xl font-semibold text-notion-text no-underline">📊 Market Analytics</a>
        </div>
        <nav class="flex-1 p-3 overflow-y-auto">
            <a href="/" class="notion-nav-item" id="nav-dashboard">
                🏠 대시보드 (카테고리 분석)
            </a>
            <a href="/apps" class="notion-nav-item" id="nav-apps">
                📱 앱 목록
            </a>
            <a href="/analysis" class="notion-nav-item" id="nav-analysis">
                📊 분석
            </a>
            <a href="/report" class="notion-nav-item" id="nav-report">
                🤖 AI 리포트
            </a>
        </nav>
        <script>
            // 현재 경로에 따라 활성 메뉴 표시
            (function() {
                const path = window.location.pathname;
                const navMap = {
                    '/': 'nav-dashboard',
                    '/apps': 'nav-apps',
                    '/analysis': 'nav-analysis',
                    '/report': 'nav-report',
                    '/category-analysis': 'nav-dashboard'
                };
                
                const activeId = navMap[path] || navMap['/'];
                if (activeId) {
                    const activeNav = document.getElementById(activeId);
                    if (activeNav) {
                        activeNav.classList.add('active');
                    }
                }
            })();
        </script>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="flex-1 overflow-y-auto">
        <div class="max-w-6xl mx-auto p-8">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
