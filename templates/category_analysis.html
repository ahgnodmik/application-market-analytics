{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- 헤더 -->
    <div>
        <h1 class="text-3xl font-semibold text-notion-text mb-2">카테고리 분석</h1>
        <p class="text-notion-text-light text-base">Play Store 카테고리별 상위 앱을 분석하고 GPT로 인사이트를 얻어보세요</p>
    </div>

    <!-- 카테고리 선택 및 분석 -->
    <div class="notion-card p-5">
        <h2 class="text-lg font-semibold text-notion-text mb-4">카테고리 분석</h2>
        
        <div class="mb-4">
            <button id="loadCategoriesBtn" class="notion-button notion-button-blue">
                카테고리 목록 불러오기
            </button>
            <div id="categoriesContainer" class="mt-4 hidden">
                <label class="block text-sm font-medium text-notion-text mb-2">분석할 카테고리 선택:</label>
                <select id="categorySelect" class="w-full px-3 py-2 border border-notion-border rounded focus:outline-none focus:ring-2 focus:ring-notion-blue">
                    <option value="">카테고리를 선택하세요</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-notion-text mb-2">분석할 앱 수:</label>
                <input type="number" id="analysisLimit" value="50" min="10" max="100" 
                       class="w-full px-3 py-2 border border-notion-border rounded focus:outline-none focus:ring-2 focus:ring-notion-blue">
            </div>
            <div>
                <label class="block text-sm font-medium text-notion-text mb-2">순위 타입:</label>
                <select id="rankingType" class="w-full px-3 py-2 border border-notion-border rounded focus:outline-none focus:ring-2 focus:ring-notion-blue">
                    <option value="top_free">무료 앱</option>
                    <option value="top_paid">유료 앱</option>
                    <option value="top_grossing">수익순</option>
                </select>
            </div>
            <div class="flex items-end">
                <button id="analyzeCategoryBtn" 
                        class="w-full notion-button notion-button-green disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled>
                    GPT 분석 시작
                </button>
            </div>
        </div>

        <div id="analysisLoading" class="hidden text-center py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-notion-blue"></div>
            <p class="mt-2 text-notion-text-light">분석 중... 잠시만 기다려주세요</p>
        </div>

        <div id="analysisResult" class="hidden mt-6">
            <div class="border-t border-notion-border pt-6">
                <h3 class="text-lg font-semibold text-notion-text mb-4">분석 결과</h3>
                <div id="analysisContent" class="space-y-6"></div>
            </div>
        </div>
    </div>

    <!-- 다중 카테고리 비교 분석 -->
    <div class="notion-card p-5">
        <h2 class="text-lg font-semibold text-notion-text mb-4">다중 카테고리 비교 분석</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-notion-text mb-2">비교할 카테고리 선택 (최대 5개):</label>
            <div id="multiCategorySelect" class="space-y-2"></div>
            <button id="addCategoryBtn" class="mt-2 text-sm text-notion-blue hover:underline">
                + 카테고리 추가
            </button>
        </div>
        
        <button id="analyzeMultipleBtn" 
                class="notion-button notion-button-green disabled:opacity-50 disabled:cursor-not-allowed"
                disabled>
            다중 카테고리 비교 분석 시작
        </button>

        <div id="multipleAnalysisLoading" class="hidden text-center py-4 mt-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-notion-blue"></div>
            <p class="mt-2 text-notion-text-light">분석 중... 잠시만 기다려주세요</p>
        </div>

        <div id="multipleAnalysisResult" class="hidden mt-6">
            <div class="border-t border-notion-border pt-6">
                <h3 class="text-lg font-semibold text-notion-text mb-4">비교 분석 결과</h3>
                <div id="multipleAnalysisContent" class="prose max-w-none bg-notion-hover p-6 rounded"></div>
            </div>
        </div>
    </div>
</div>

<script>
let categories = [];
let selectedCategories = [];

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('loadCategoriesBtn').addEventListener('click', loadCategories);
    document.getElementById('categorySelect').addEventListener('change', function() {
        document.getElementById('analyzeCategoryBtn').disabled = !this.value;
    });
    document.getElementById('analyzeCategoryBtn').addEventListener('click', analyzeCategory);
    document.getElementById('addCategoryBtn').addEventListener('click', addCategorySelector);
    document.getElementById('analyzeMultipleBtn').addEventListener('click', analyzeMultipleCategories);
});

async function loadCategories() {
    const btn = document.getElementById('loadCategoriesBtn');
    btn.disabled = true;
    btn.textContent = '로딩 중...';
    
    try {
        const response = await fetch('/api/playstore/categories');
        const data = await response.json();
        
        if (data.success && data.categories) {
            categories = data.categories;
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="">카테고리를 선택하세요</option>' +
                categories.map(cat => `<option value="${cat.key}">${cat.name}</option>`).join('');
            
            document.getElementById('categoriesContainer').classList.remove('hidden');
            btn.textContent = '카테고리 목록 불러오기';
            btn.disabled = false;
        } else {
            throw new Error('카테고리 목록을 불러올 수 없습니다.');
        }
    } catch (error) {
        console.error('Error loading categories:', error);
        alert('카테고리 목록을 불러오는 중 오류가 발생했습니다.');
        btn.textContent = '카테고리 목록 불러오기';
        btn.disabled = false;
    }
}

function addCategorySelector() {
    if (selectedCategories.length >= 5) {
        alert('최대 5개까지만 선택할 수 있습니다.');
        return;
    }
    
    const container = document.getElementById('multiCategorySelect');
    const index = selectedCategories.length;
    const select = document.createElement('select');
    select.className = 'w-full px-3 py-2 border border-notion-border rounded focus:outline-none focus:ring-2 focus:ring-notion-blue';
    select.innerHTML = '<option value="">카테고리 선택</option>' +
        categories.map(cat => `<option value="${cat.key}">${cat.name}</option>`).join('');
    
    const wrapper = document.createElement('div');
    wrapper.className = 'flex gap-2';
    wrapper.appendChild(select);
    
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '×';
    removeBtn.className = 'px-3 py-2 text-red-600 hover:bg-red-50 rounded';
    removeBtn.onclick = () => {
        wrapper.remove();
        selectedCategories = selectedCategories.filter((_, i) => i !== index);
        updateMultipleAnalyzeButton();
    };
    wrapper.appendChild(removeBtn);
    
    container.appendChild(wrapper);
    selectedCategories.push(null);
    
    select.addEventListener('change', function() {
        selectedCategories[index] = this.value || null;
        updateMultipleAnalyzeButton();
    });
}

function updateMultipleAnalyzeButton() {
    const hasSelection = selectedCategories.some(cat => cat);
    document.getElementById('analyzeMultipleBtn').disabled = !hasSelection;
}

// 마크다운을 Notion 스타일로 렌더링하는 함수
function renderMarkdownToNotion(markdown) {
    if (!markdown) return '<div class="text-notion-text-light">분석 결과가 없습니다.</div>';
    
    let html = '';
    const lines = markdown.split('\n');
    let inList = false;
    let inCodeBlock = false;
    let currentSection = null;
    
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        // 코드 블록 처리
        if (trimmed.startsWith('```')) {
            inCodeBlock = !inCodeBlock;
            if (inCodeBlock) {
                html += '<pre class="bg-notion-code-block p-4 rounded border border-notion-border overflow-x-auto my-4"><code>';
            } else {
                html += '</code></pre>';
            }
            continue;
        }
        
        if (inCodeBlock) {
            html += escapeHtml(line) + '\n';
            continue;
        }
        
        // H2 (##) - 섹션 제목
        if (trimmed.match(/^##\s+/)) {
            if (inList) {
                html += '</ul>';
                inList = false;
            }
            const title = trimmed.replace(/^##\s+/, '');
            html += `<div class="mt-8 mb-4 first:mt-0">
                <h2 class="text-2xl font-semibold text-notion-text border-b border-notion-border pb-2">${escapeHtml(title)}</h2>
            </div>`;
            currentSection = title;
            continue;
        }
        
        // H3 (###) - 소제목
        if (trimmed.match(/^###\s+/)) {
            if (inList) {
                html += '</ul>';
                inList = false;
            }
            const title = trimmed.replace(/^###\s+/, '');
            html += `<div class="mt-6 mb-3">
                <h3 class="text-xl font-semibold text-notion-text">${escapeHtml(title)}</h3>
            </div>`;
            continue;
        }
        
        // 리스트 항목 (-)
        if (trimmed.match(/^-\s+/)) {
            if (!inList) {
                html += '<ul class="list-none space-y-2 my-3 pl-0">';
                inList = true;
            }
            const item = trimmed.replace(/^-\s+/, '');
            // **볼드** 처리
            const formattedItem = item.replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-notion-text">$1</strong>');
            html += `<li class="flex items-start">
                <span class="text-notion-text mr-2 mt-1">•</span>
                <span class="text-notion-text-light flex-1">${formattedItem}</span>
            </li>`;
            continue;
        }
        
        // 볼드 텍스트 라인 (**텍스트**)
        if (trimmed.match(/^\*\*.+\*\*$/)) {
            if (inList) {
                html += '</ul>';
                inList = false;
            }
            const boldText = trimmed.replace(/\*\*/g, '');
            html += `<div class="my-3">
                <p class="font-semibold text-lg text-notion-text">${escapeHtml(boldText)}</p>
            </div>`;
            continue;
        }
        
        // 일반 텍스트
        if (trimmed) {
            if (inList) {
                html += '</ul>';
                inList = false;
            }
            // **볼드** 처리
            let formattedText = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-notion-text">$1</strong>');
            // 인라인 코드 처리
            formattedText = formattedText.replace(/`(.+?)`/g, '<code class="bg-notion-code-inline px-1.5 py-0.5 rounded text-sm font-mono text-notion-text">$1</code>');
            html += `<p class="text-notion-text-light leading-relaxed my-3">${formattedText}</p>`;
        } else {
            // 빈 줄
            if (inList) {
                html += '</ul>';
                inList = false;
            }
            if (i < lines.length - 1) { // 마지막 줄이 아니면
                html += '<div class="my-2"></div>';
            }
        }
    }
    
    if (inList) {
        html += '</ul>';
    }
    
    // 전체를 Notion 스타일 컨테이너로 감싸기
    return `<div class="notion-content space-y-4">${html}</div>`;
}

// HTML 이스케이프 함수
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function analyzeCategory() {
    const categoryKey = document.getElementById('categorySelect').value;
    const limit = parseInt(document.getElementById('analysisLimit').value);
    const rankingType = document.getElementById('rankingType').value;
    
    if (!categoryKey) {
        alert('카테고리를 선택해주세요.');
        return;
    }
    
    const loading = document.getElementById('analysisLoading');
    const result = document.getElementById('analysisResult');
    const content = document.getElementById('analysisContent');
    const btn = document.getElementById('analyzeCategoryBtn');
    
    loading.classList.remove('hidden');
    result.classList.add('hidden');
    btn.disabled = true;
    
    try {
        const response = await fetch('/api/playstore/analyze-category', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                play_category: categoryKey,
                limit: limit,
                ranking_type: rankingType
            })
        });
        
        const data = await response.json();
        
        if (data.success && data.report) {
            // 마크다운 형식의 리포트를 Notion 스타일로 렌더링
            content.innerHTML = renderMarkdownToNotion(data.report);
            result.classList.remove('hidden');
        } else {
            const errorMsg = data.detail || data.error || '분석 실패';
            throw new Error(errorMsg);
        }
    } catch (error) {
        console.error('Error analyzing category:', error);
        let errorMessage = error.message || '알 수 없는 오류';
        
        // 서버에서 반환한 상세 에러 메시지 표시
        if (error.response) {
            try {
                const errorData = await error.response.json();
                errorMessage = errorData.detail || errorData.error || errorMessage;
            } catch (e) {
                // JSON 파싱 실패 시 기본 메시지 사용
            }
        }
        
        content.innerHTML = `
            <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                <h3 class="text-red-800 font-semibold mb-2">분석 실패</h3>
                <p class="text-red-600">${errorMessage}</p>
                <p class="text-sm text-red-500 mt-2">Railway 로그를 확인하여 자세한 오류 정보를 확인하세요.</p>
            </div>
        `;
        result.classList.remove('hidden');
    } finally {
        loading.classList.add('hidden');
        btn.disabled = false;
    }
}

async function analyzeMultipleCategories() {
    const categoriesToAnalyze = selectedCategories.filter(cat => cat);
    
    if (categoriesToAnalyze.length === 0) {
        alert('최소 1개 이상의 카테고리를 선택해주세요.');
        return;
    }
    
    const loading = document.getElementById('multipleAnalysisLoading');
    const result = document.getElementById('multipleAnalysisResult');
    const content = document.getElementById('multipleAnalysisContent');
    const btn = document.getElementById('analyzeMultipleBtn');
    
    loading.classList.remove('hidden');
    result.classList.add('hidden');
    btn.disabled = true;
    
    try {
        const response = await fetch('/api/playstore/analyze-multiple-categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                categories: categoriesToAnalyze,
                limit_per_category: 50,
                ranking_type: 'top_free'
            })
        });
        
        const data = await response.json();
        
        if (data.success && data.report) {
            content.innerHTML = data.report.replace(/\n/g, '<br>');
            result.classList.remove('hidden');
        } else {
            throw new Error(data.error || '분석 실패');
        }
    } catch (error) {
        console.error('Error analyzing multiple categories:', error);
        content.innerHTML = `<p class="text-red-600">분석 중 오류가 발생했습니다: ${error.message}</p>`;
        result.classList.remove('hidden');
    } finally {
        loading.classList.add('hidden');
        btn.disabled = false;
    }
}
</script>
{% endblock %}
